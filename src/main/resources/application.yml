spring:
    application:
        name: backend-nexus

    datasource:
        url: jdbc:postgresql://localhost:5432/Nexus
        username: postgres
        password: 123
        driver-class-name: org.postgresql.Driver

    jpa:
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                "[format_sql]": true

    mvc:
        problemdetails:
            enabled: true

server:
    port: 8080
    servlet:
        context-path: /api/v1